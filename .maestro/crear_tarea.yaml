appId: com.taskmanager.app
---
# ==== Actividad 3: evidencia con capturas automáticas de Maestro ====
- launchApp:
          clearState: true
- takeScreenshot: 01_pantalla_inicial
- assertVisible: "Nueva tarea"
- tapOn:
          id: "input-titulo"
- inputText: "Mi primera tarea de prueba"
- takeScreenshot: 02_titulo_escrito
- tapOn: "Guardar"
- assertVisible: "Error al crear la tarea"
- takeScreenshot: 03_error_mostrado